aid: coinswitch
name: CoinSwitch
description: >-
  CoinSwitch is one of India's largest retail crypto investing platforms, based
  in Bengaluru and backed by a16z, Paradigm, and Ribbit Capital. Alongside its
  consumer buy/sell app it operates CoinSwitch PRO, a professional trading venue
  that exposes a public REST and WebSocket API for programmatic trading. The
  CoinSwitch PRO API (base https://coinswitch.co/trade/api/v2) covers Spot
  trading on INR and USDT pairs, USDT-margined Perpetual Futures with up to 100x
  leverage, low-latency High-Frequency Trading (HFT) endpoints, and Options
  (private beta). Developers can place, cancel, and track orders, read
  portfolios and trading fees, and subscribe to real-time order, balance, and
  candlestick streams over Socket.IO. Requests authenticate with an API key and
  an Ed25519 request signature (X-AUTH-APIKEY / X-AUTH-SIGNATURE / X-AUTH-EPOCH),
  with reference signing implementations published for Python, Java, Go, and
  Node.js.
